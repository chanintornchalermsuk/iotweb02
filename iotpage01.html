<!-- HTML เป็นภาษาที่ใช้ในการทำโครงหน้าเว็บ -->
<!doctype html>

<html lang="en">
  <!-- ส่วนของ head การกำหนดรายละเอียดของเว็บหรือของเพจ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="เขียนอธิบายเกี่ยวกับเว็บหรือเว็บเพจของเรา...." />
    <meta name="keywords" content="เขียนเป็นคำๆ สำคัญเกี่ยวกับเว็บหรือเว็บเพจของเรา...." />
    <title>ชื่อเพจ - ชื่อเว็บ</title>
    <link rel="shortcut icon" href="./images/icon.png" type="image/png" />
  </head>

  <!-- ส่วนของ body การกำหนดรายละเอียดที่จะแสดงที่หน้า Browser -->
  <body>
    <!-- HTML : Line Break TAG (ขึ้นบรรทัดใหม่), Horizontal Rule TAG (เส้นแบ่ง)-->
    AAAAAAA <br><br>BBBBBBB
    <br><br><br>
            CCCCC&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;CCCCCC

    <hr>

    <!-- HTML : Pre formatted text TAG -->
    <pre>
DDDDDDD
          FFFFFFF              FFFFFFFF


GGGGGGGGGGG                 GGGGGGGGGGGGGGGGGGGGGGGGGGGG

      HHHHHHHHHHHHHH                 H
    </pre>

  </body>
</html>
